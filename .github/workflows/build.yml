name: Build TOS
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Usar o código mais novo do meu fork
        run: git submodule update --init --remote app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew
        working-directory: app
      - run: ./gradlew assembleDebug --stacktrace
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: TOS-apk
          path: app/app/build/outputs/apk/**/*.apk
