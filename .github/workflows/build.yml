name: Build TOS
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Trocar a pasta app pelo meu fork
        run: |
          rm -rf app
          git clone --depth 1 https://github.com/larlen12532/winlator-app.git app
          git -C app log -1 --oneline
          grep -n 'name="app_name"' app/app/src/main/res/values/strings.xml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew
        working-directory: app
      - run: ./gradlew assembleDebug --stacktrace
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: TOS-apk
          path: app/app/build/outputs/apk/**/*.apk
